name: Android

# Builds the Android app (APK) from the single-file web app with Capacitor.
# Run it by hand to get a test APK, or let the release workflow call it to attach the APK to a release.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: "Release tag to attach the APK to, e.g. v1.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version || 'dev' }}
      # Optional repository secrets for a stable signing key (see README). Without them the APK is debug-signed.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:single
      - run: npx cap sync android
      - name: Version
        run: |
          v="${VERSION#v}"
          if [[ "$v" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "APP_VERSION_CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION_CODE=1" >> "$GITHUB_ENV"
          fi
          echo "APP_VERSION_NAME=$v" >> "$GITHUB_ENV"
      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/benefitbridge.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/benefitbridge.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: benefitbridge-apk
          path: ${{ runner.temp }}/benefitbridge.apk
      - name: Attach to release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "$RUNNER_TEMP/benefitbridge.apk" --clobber
