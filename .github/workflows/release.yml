name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v1.0.0 (the tag is created on the current commit)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package
        run: |
          mkdir -p release
          cp dist-single/index.html release/benefitbridge.html
          (cd dist && zip -r ../release/benefitbridge-web.zip .)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" release/benefitbridge.html release/benefitbridge-web.zip \
            --target "$GITHUB_SHA" \
            --title "BenefitBridge $VERSION" \
            --notes-file docs/RELEASE_NOTES.md

  android:
    needs: release
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
    secrets: inherit
