name: Bug
description: Something in the app doesn't work or looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and app (Android app, browser, single file)
  - type: input
    id: language
    attributes:
      label: Language and state you chose
